name: 文档构建与测试

on:
    pull_request:
        branches: [dev, main]
        paths:
            - "docs/**"
            - "scripts/**"
            - ".github/workflows/docs-build-test.yml"

permissions:
    contents: read

jobs:
    docs-check:
        name: 校验并构建文档
        runs-on: ubuntu-latest

        steps:
            - name: 检出代码
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: 设置 Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "latest"
                  cache: npm

            - name: 安装依赖
              run: npm ci

            - name: 运行侧边栏验证
              run: node scripts/validate-sidebar.js

            - name: 运行图片路径验证
              run: node scripts/validate-images.js

            - name: 构建文档
              run: npm run docs:build
